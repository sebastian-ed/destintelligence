<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Destintelligence · Dashboard público</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><style>body{font-family:Inter,sans-serif;background:#f4f2ed;color:#1c2721;margin:0}.shell{max-width:1180px;margin:0 auto;padding:55px 20px}.head{padding-top:25px;border-top:9px solid #315d4d;margin-bottom:35px}.head span{font-size:.75rem;color:#6d7771}.head h1{font-size:2.7rem;letter-spacing:-.05em;margin:5px 0}.head p{color:#6d7771}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.k,.panel{background:#fff;border:1px solid #dfe4e1;border-radius:15px;padding:20px}.k span{font-size:.7rem;color:#6d7771}.k strong{display:block;font-size:1.8rem;margin-top:20px}.panel{margin-top:15px}.barline{display:grid;grid-template-columns:1fr 2fr 45px;gap:8px;align-items:center;margin:8px 0;font-size:.75rem}.bar{height:8px;background:#edf0ee;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#315d4d}footer{margin-top:35px;color:#78837d;font-size:.7rem}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:500px){.grid{grid-template-columns:1fr}.head h1{font-size:2rem}}</style></head><body><main class="shell" id="app"><p>Cargando dashboard…</p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="public.js"></script></body></html>
